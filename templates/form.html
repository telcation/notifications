{% extends "base.html" %}
{% block content %}

<h2>{% if mode == 'add' %}リマインダーの追加{% else %}リマインダーの編集{% endif %}</h2>

{% if error %}
  <div class="error">{{ error }}</div>
{% endif %}

<form method="post">
  <div class="field">
    <label for="message">件名</label>
    <input type="text" id="message" name="message"
           value="{{ reminder.message if reminder else '' }}" required>
  </div>

  <div class="field">
    <label for="notify_datetime">通知日時</label>
    <input type="datetime-local" id="notify_datetime" name="notify_datetime"
           value="{{ reminder.notify_datetime if reminder else '' }}" required>
  </div>

  <div class="field">
    <label for="repeat_interval">繰り返し間隔</label>
    <input type="number" id="repeat_interval" name="repeat_interval" min="1" step="1"
           value="{{ reminder.repeat_interval if reminder and reminder.repeat_interval else 1 }}">
  </div>

  <div class="field">
    <label for="repeat_unit">繰り返し単位</label>
    <select id="repeat_unit" name="repeat_unit">
      {% for choice in repeat_unit_choices %}
      <option value="{{ choice }}"
        {% if reminder and reminder.repeat_unit == choice %}selected{% endif %}>
        {{ repeat_unit_labels[choice] }}
      </option>
      {% endfor %}
    </select>
    <p style="font-size:12px; color:#94a3b8; margin-top:4px;">
      例: 間隔「3」+ 単位「日ごと」= 3日ごと。単位が「1回のみ」の場合、間隔は無視されます。
    </p>
  </div>

  <button type="submit" class="btn btn-primary">保存</button>
  <a href="{{ url_for('index') }}" class="btn btn-secondary">キャンセル</a>
</form>

{% endblock %}
