<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LINEリマインダー管理</title>
  <style>
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 20px; }
    a { color: #60a5fa; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; }
    th { color: #94a3b8; font-weight: 600; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .badge-on { background: #14532d; color: #bbf7d0; }
    .badge-off { background: #4b1113; color: #fecaca; }
    .btn {
      display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px;
      border: none; cursor: pointer; text-decoration: none; margin-right: 4px;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    form.inline { display: inline; }
    input, select {
      background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      padding: 8px; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;
    }
    label { display: block; margin: 12px 0 4px; font-size: 13px; color: #94a3b8; }
    .field { margin-bottom: 16px; max-width: 420px; }
    .error { background: #4b1113; color: #fecaca; padding: 10px; border-radius: 6px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>📅 LINEリマインダー管理</h1>
  {% block content %}{% endblock %}
</body>
</html>
