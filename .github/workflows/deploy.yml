name: Deploy to backup-server

# main ブランチへのpushで、backup-server上のセルフホストランナーがジョブを取得して実行する。
# GitHub側からbackup-serverへ接続することはない(ランナーがアウトバウンドでポーリングする)ため、
# backup-server側でSSHやポート開放を行う必要はない。

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  DEPLOY_DIR: /home/ksk/notifications
  VENV_DIR: /home/ksk/notifications-venv

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python構文チェック
        run: |
          python3 -m py_compile notification_client.py reminders_store.py reminder_manager.py \
            send_reminder.py reminder_web.py calendar_config_store.py calendar_notify.py \
            calendar_print_sa.py

      - name: 依存パッケージをvenvへインストール
        run: |
          if [ ! -d "${VENV_DIR}" ]; then
            python3 -m venv "${VENV_DIR}"
          fi
          "${VENV_DIR}/bin/pip" install --upgrade pip
          "${VENV_DIR}/bin/pip" install -r requirements.txt

      - name: デプロイ(認証情報・状態ファイルは保持したまま同期)
        run: |
          mkdir -p "${DEPLOY_DIR}"
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude '.env' \
            --exclude 'calendar_config.json' \
            --exclude 'service_account.json' \
            --exclude 'reminders.json' \
            --exclude '*.log' \
            ./ "${DEPLOY_DIR}/"

      - name: 初回のみテンプレートから実ファイルを生成
        run: |
          cd "${DEPLOY_DIR}"
          [ -f reminders.json ] || cp reminders.json.example reminders.json
          if [ ! -f .env ]; then
            echo "::warning::.env が存在しません。手動で ${DEPLOY_DIR}/.env を作成し、NOTIFICATION_BASE_URL / NOTIFICATION_API_KEY を設定してください。"
          fi
          if [ ! -f calendar_config.json ]; then
            echo "::warning::calendar_config.json が存在しません。手動で作成してください。"
          fi

      - name: Web GUI(reminder-web.service)を配置・再起動
        continue-on-error: true
        run: |
          chmod +x "${DEPLOY_DIR}/deploy_install_service.sh"
          sudo "${DEPLOY_DIR}/deploy_install_service.sh"

      - name: デプロイ完了をNotificationAPI経由でLINE通知
        continue-on-error: true
        run: |
          cd "${DEPLOY_DIR}"
          "${VENV_DIR}/bin/python" -c "
          from dotenv import load_dotenv
          load_dotenv()
          from notification_client import notify
          import subprocess
          sha = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()
          notify(f'✅ notifications デプロイ完了 ({sha})', line=True, email=False)
          "
